name: CI

on: [push]

jobs:
  eslint:
    name: Run eslint scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install node dependencies
        run: |
          npm install

      - name: Run ESLint
        run: npx eslint
        continue-on-error: true
